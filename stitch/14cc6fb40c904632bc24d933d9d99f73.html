<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris - Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#6f00be",
                        "on-surface-variant": "#bdc8d1",
                        "on-secondary-fixed": "#2c0051",
                        "secondary-fixed": "#f0dbff",
                        "on-background": "#e0e3e5",
                        "on-primary-container": "#004965",
                        "surface-variant": "#323537",
                        "primary": "#8ed5ff",
                        "error": "#ffb4ab",
                        "surface-dim": "#101415",
                        "on-surface": "#e0e3e5",
                        "tertiary-container": "#f1a02b",
                        "on-primary-fixed": "#001e2c",
                        "surface-container-highest": "#323537",
                        "background": "#101415",
                        "outline-variant": "#3e484f",
                        "on-primary-fixed-variant": "#004c69",
                        "outline": "#87929a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#363a3b",
                        "inverse-primary": "#00668a",
                        "on-error": "#690005",
                        "on-primary": "#00354a",
                        "tertiary-fixed-dim": "#ffb960",
                        "primary-container": "#38bdf8",
                        "surface": "#101415",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary": "#ffc176",
                        "on-tertiary-container": "#613b00",
                        "secondary": "#ddb7ff",
                        "inverse-surface": "#e0e3e5",
                        "inverse-on-surface": "#2d3133",
                        "surface-container-high": "#272a2c",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary": "#490080",
                        "surface-container": "#1d2022",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-secondary-container": "#d6a9ff",
                        "surface-tint": "#7bd0ff",
                        "surface-container-lowest": "#0b0f10",
                        "primary-fixed": "#c4e7ff",
                        "on-secondary-fixed-variant": "#6900b3",
                        "surface-container-low": "#191c1e",
                        "primary-fixed-dim": "#7bd0ff",
                        "on-tertiary": "#472a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-padding": "20px",
                        "gutter": "16px",
                        "unit": "4px",
                        "block-size": "32px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "stat-value": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "stat-value": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .neon-glow-primary {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .neon-glow-error {
            text-shadow: 0 0 15px rgba(255, 180, 171, 0.6);
        }
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image:
                linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col relative">
<!-- Background: Dimmed Locked-in Board State -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none flex justify-center items-center">
<div class="w-[320px] h-[640px] bg-surface-container-highest border border-outline-variant bg-grid-pattern relative">
<!-- Simulated stacked blocks at the bottom -->
<div class="absolute bottom-0 w-full h-32 bg-secondary-container opacity-50"></div>
<div class="absolute bottom-32 left-0 w-1/2 h-16 bg-tertiary-container opacity-50"></div>
<div class="absolute bottom-16 right-0 w-1/3 h-24 bg-primary-container opacity-50"></div>
</div>
</div>
<!-- Main Content Canvas - Game Over Overlay -->
<main class="flex-grow flex items-center justify-center relative z-10 px-6">
<div class="bg-surface/90 backdrop-blur-md border border-outline-variant p-8 md:p-12 w-full max-w-md flex flex-col items-center shadow-2xl relative">
<!-- Game Over Title -->
<h1 class="font-display-lg text-display-lg text-error mb-8 tracking-widest neon-glow-error text-center uppercase">
                GAME OVER
            </h1>
<!-- High Score Indicator -->
<div class="bg-primary/10 border border-primary px-4 py-1 mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
<span class="font-label-mono text-label-mono text-primary uppercase">New High Score!</span>
</div>
<!-- Stats Panel -->
<div class="w-full bg-surface-container-high border border-outline-variant p-6 flex flex-col gap-6 mb-8">
<!-- Final Score -->
<div class="flex flex-col items-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1">Final Score</span>
<span class="font-stat-value text-stat-value text-on-background text-4xl">145,820</span>
</div>
<div class="h-px w-full bg-outline-variant/50"></div>
<!-- Secondary Stats -->
<div class="flex justify-between w-full">
<div class="flex flex-col items-center w-1/2 border-r border-outline-variant/50">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1">Level</span>
<span class="font-stat-value text-stat-value text-on-background">15</span>
</div>
<div class="flex flex-col items-center w-1/2">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1">Lines</span>
<span class="font-stat-value text-stat-value text-on-background">142</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-surface-variant border border-on-background font-headline-sm text-headline-sm text-on-background py-4 hover:border-primary hover:text-primary transition-all duration-200 neon-glow-primary flex justify-center items-center gap-2 group">
<span class="material-symbols-outlined group-hover:text-primary">replay</span>
                    Play Again
                </button>
<button class="w-full bg-surface border border-outline-variant font-headline-sm text-headline-sm text-on-surface-variant py-4 hover:bg-surface-variant transition-colors duration-200">
                    Main Menu
                </button>
</div>
</div>
</main>
</body></html>
