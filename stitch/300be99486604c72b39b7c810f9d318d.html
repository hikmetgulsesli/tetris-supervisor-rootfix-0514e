<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Neon - Main Menu</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#6f00be",
                        "on-surface-variant": "#bdc8d1",
                        "on-secondary-fixed": "#2c0051",
                        "secondary-fixed": "#f0dbff",
                        "on-background": "#e0e3e5",
                        "on-primary-container": "#004965",
                        "surface-variant": "#323537",
                        "primary": "#8ed5ff",
                        "error": "#ffb4ab",
                        "surface-dim": "#101415",
                        "on-surface": "#e0e3e5",
                        "tertiary-container": "#f1a02b",
                        "on-primary-fixed": "#001e2c",
                        "surface-container-highest": "#323537",
                        "background": "#101415",
                        "outline-variant": "#3e484f",
                        "on-primary-fixed-variant": "#004c69",
                        "outline": "#87929a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#363a3b",
                        "inverse-primary": "#00668a",
                        "on-error": "#690005",
                        "on-primary": "#00354a",
                        "tertiary-fixed-dim": "#ffb960",
                        "primary-container": "#38bdf8",
                        "surface": "#101415",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary": "#ffc176",
                        "on-tertiary-container": "#613b00",
                        "secondary": "#ddb7ff",
                        "inverse-surface": "#e0e3e5",
                        "inverse-on-surface": "#2d3133",
                        "surface-container-high": "#272a2c",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary": "#490080",
                        "surface-container": "#1d2022",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-secondary-container": "#d6a9ff",
                        "surface-tint": "#7bd0ff",
                        "surface-container-lowest": "#0b0f10",
                        "primary-fixed": "#c4e7ff",
                        "on-secondary-fixed-variant": "#6900b3",
                        "surface-container-low": "#191c1e",
                        "primary-fixed-dim": "#7bd0ff",
                        "on-tertiary": "#472a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-padding": "20px",
                        "gutter": "16px",
                        "unit": "4px",
                        "block-size": "32px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "stat-value": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "stat-value": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom styles for grid and glowing effects adhering to design guidelines */
        .tetris-grid-bg {
            background-image: 
                linear-gradient(to right, rgba(62, 72, 79, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(62, 72, 79, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center;
        }
        
        .neon-glow-primary {
            filter: drop-shadow(0 0 15px rgba(142, 213, 255, 0.6));
        }

        .neon-text-glow {
            text-shadow: 0 0 20px rgba(142, 213, 255, 0.8), 0 0 40px rgba(142, 213, 255, 0.4);
        }

        .menu-button {
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid transparent;
            border-radius: 0.125rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            pointer-events: none;
        }

        .menu-button:not(:disabled):hover::before {
            border-color: theme('colors.primary');
            box-shadow: 0 0 15px rgba(142, 213, 255, 0.5), inset 0 0 10px rgba(142, 213, 255, 0.2);
        }
        
        /* Ghost piece projections in background */
        .ghost-block {
            position: absolute;
            border: 2px solid rgba(142, 213, 255, 0.1);
            background: rgba(142, 213, 255, 0.02);
            box-shadow: inset 0 0 10px rgba(142, 213, 255, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md selection:bg-primary selection:text-on-primary">
<!-- Background Grid & Decorative Elements -->
<div class="absolute inset-0 z-0 tetris-grid-bg">
<!-- Abstract Tetromino shapes embedded in the grid -->
<div class="ghost-block w-[128px] h-[32px] top-[20%] left-[10%] transform -rotate-90"></div>
<div class="ghost-block w-[64px] h-[64px] bottom-[15%] right-[15%] border-[rgba(255,180,171,0.1)] bg-[rgba(255,180,171,0.02)]"></div>
<div class="ghost-block w-[96px] h-[32px] top-[10%] right-[20%] border-[rgba(241,160,43,0.1)] bg-[rgba(241,160,43,0.02)]">
<div class="absolute top-[32px] left-[32px] w-[32px] h-[32px] border-r-2 border-b-2 border-[rgba(241,160,43,0.1)] bg-[rgba(241,160,43,0.02)]"></div>
</div>
<!-- Subtle central well vignette -->
<div class="absolute inset-0 bg-radial-gradient from-transparent via-background/50 to-background"></div>
</div>
<!-- Main Content Container -->
<main class="z-10 flex flex-col items-center justify-center w-full max-w-md px-margin space-y-16">
<!-- Brand Title -->
<div class="text-center relative">
<h1 class="font-display-lg text-display-lg md:text-[64px] md:leading-[72px] text-primary uppercase tracking-[0.2em] neon-text-glow m-0">
                TETRIS<br/>NEON
            </h1>
<div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-24 h-1 bg-primary neon-glow-primary"></div>
</div>
<!-- Menu Navigation -->
<nav aria-label="Main Menu" class="flex flex-col w-full space-y-unit">
<!-- Start Game -->
<button class="menu-button w-full h-[64px] bg-surface-variant border border-on-background text-on-background font-headline-sm text-headline-sm uppercase tracking-widest flex items-center justify-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background rounded">
<span class="group-hover:text-primary transition-colors duration-200">Start Game</span>
</button>
<!-- Resume (Disabled State) -->
<button aria-disabled="true" class="w-full h-[64px] bg-surface-container border border-outline-variant text-outline-variant font-headline-sm text-headline-sm uppercase tracking-widest flex items-center justify-center cursor-not-allowed rounded opacity-60" disabled="" title="No active session">
                Resume
                <span class="material-symbols-outlined ml-2 text-[20px]" style="font-variation-settings: 'FILL' 0;">lock</span>
</button>
<!-- High Scores -->
<button class="menu-button w-full h-[64px] bg-surface-variant border border-on-background text-on-background font-headline-sm text-headline-sm uppercase tracking-widest flex items-center justify-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background rounded mt-4">
<span class="group-hover:text-primary transition-colors duration-200">High Scores</span>
</button>
<!-- Settings -->
<button class="menu-button w-full h-[64px] bg-surface-variant border border-on-background text-on-background font-headline-sm text-headline-sm uppercase tracking-widest flex items-center justify-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background rounded mt-4">
<span class="group-hover:text-primary transition-colors duration-200">Settings</span>
</button>
<!-- Controls -->
<button class="menu-button w-full h-[64px] bg-surface-variant border border-on-background text-on-background font-headline-sm text-headline-sm uppercase tracking-widest flex items-center justify-center group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background rounded mt-4">
<span class="group-hover:text-primary transition-colors duration-200">Controls</span>
</button>
</nav>
<!-- Version/Footer Info -->
<div class="absolute bottom-margin font-label-mono text-label-mono text-outline uppercase tracking-widest">
            v 2.0.4.1
        </div>
</main>
</body></html>
