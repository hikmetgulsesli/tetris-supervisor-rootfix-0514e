<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Neon - Paused</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#6f00be",
                      "on-surface-variant": "#bdc8d1",
                      "on-secondary-fixed": "#2c0051",
                      "secondary-fixed": "#f0dbff",
                      "on-background": "#e0e3e5",
                      "on-primary-container": "#004965",
                      "surface-variant": "#323537",
                      "primary": "#8ed5ff",
                      "error": "#ffb4ab",
                      "surface-dim": "#101415",
                      "on-surface": "#e0e3e5",
                      "tertiary-container": "#f1a02b",
                      "on-primary-fixed": "#001e2c",
                      "surface-container-highest": "#323537",
                      "background": "#101415",
                      "outline-variant": "#3e484f",
                      "on-primary-fixed-variant": "#004c69",
                      "outline": "#87929a",
                      "on-tertiary-fixed": "#2a1700",
                      "on-error-container": "#ffdad6",
                      "surface-bright": "#363a3b",
                      "inverse-primary": "#00668a",
                      "on-error": "#690005",
                      "on-primary": "#00354a",
                      "tertiary-fixed-dim": "#ffb960",
                      "primary-container": "#38bdf8",
                      "surface": "#101415",
                      "on-tertiary-fixed-variant": "#653e00",
                      "tertiary": "#ffc176",
                      "on-tertiary-container": "#613b00",
                      "secondary": "#ddb7ff",
                      "inverse-surface": "#e0e3e5",
                      "inverse-on-surface": "#2d3133",
                      "surface-container-high": "#272a2c",
                      "error-container": "#93000a",
                      "tertiary-fixed": "#ffddb8",
                      "on-secondary": "#490080",
                      "surface-container": "#1d2022",
                      "secondary-fixed-dim": "#ddb7ff",
                      "on-secondary-container": "#d6a9ff",
                      "surface-tint": "#7bd0ff",
                      "surface-container-lowest": "#0b0f10",
                      "primary-fixed": "#c4e7ff",
                      "on-secondary-fixed-variant": "#6900b3",
                      "surface-container-low": "#191c1e",
                      "primary-fixed-dim": "#7bd0ff",
                      "on-tertiary": "#472a00"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "panel-padding": "20px",
                      "gutter": "16px",
                      "unit": "4px",
                      "block-size": "32px",
                      "margin": "24px"
              },
              "fontFamily": {
                      "display-lg": [
                              "Hanken Grotesk"
                      ],
                      "label-mono": [
                              "JetBrains Mono"
                      ],
                      "headline-sm": [
                              "Hanken Grotesk"
                      ],
                      "body-md": [
                              "Hanken Grotesk"
                      ],
                      "stat-value": [
                              "JetBrains Mono"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",

                              }
                      ],
                      "label-mono": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-sm": [
                              "20px",

                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-md": [
                              "16px",

                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "stat-value": [
                              "24px",

                                      "lineHeight": "32px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg": [

                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"

                      ]
              }
            }
          }
        }
      </script>
<style>
        .grid-pattern {
            background-image: linear-gradient(to right, rgba(62, 72, 79, 0.3) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(62, 72, 79, 0.3) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .neon-text-glow {
            text-shadow: 0 0 15px rgba(142, 213, 255, 0.6);
        }
        .neon-box-glow:hover {
            box-shadow: 0 0 20px rgba(142, 213, 255, 0.4);
            border-color: #8ed5ff;
        }
        .secondary-box-glow:hover {
            box-shadow: 0 0 15px rgba(221, 183, 255, 0.3);
            border-color: #ddb7ff;
            color: #ddb7ff;
        }
        .error-box-glow:hover {
            box-shadow: 0 0 15px rgba(255, 180, 171, 0.3);
            border-color: #ffb4ab;
            color: #ffb4ab;
        }
        .block-bevel {
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.3);
        }
      </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative font-body-md selection:bg-primary selection:text-on-primary">
<!-- Mock Gameplay Background (Dimmed) -->
<div class="absolute inset-0 flex items-center justify-center p-4 blur-[2px] opacity-60">
<!-- Main Playfield -->
<div class="w-[320px] h-[640px] bg-surface-container-lowest border-2 border-outline-variant relative grid-pattern flex-shrink-0">
<!-- Placed Blocks Mockup -->
<div class="absolute bottom-0 left-[32px] w-[96px] h-[32px] bg-secondary block-bevel"></div>
<div class="absolute bottom-0 left-[160px] w-[64px] h-[64px] bg-tertiary block-bevel"></div>
<div class="absolute bottom-[32px] left-[64px] w-[64px] h-[32px] bg-primary block-bevel"></div>
<div class="absolute bottom-[32px] left-[128px] w-[32px] h-[96px] bg-error block-bevel"></div>
<!-- Falling Piece -->
<div class="absolute top-[256px] left-[128px] w-[96px] h-[32px] bg-primary block-bevel shadow-[0_0_20px_#8ed5ff]"></div>
<!-- Ghost Piece -->
<div class="absolute bottom-[96px] left-[128px] w-[96px] h-[32px] border-2 border-primary/40 bg-transparent"></div>
</div>
</div>
<!-- Pause Overlay Canvas -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-md z-40 flex items-center justify-center p-6">
<!-- Pause Modal (Glassmorphism/Bento) -->
<div class="bg-surface/90 border border-outline-variant rounded-xl p-8 max-w-[400px] w-full flex flex-col gap-10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
<!-- Header -->
<div class="text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-widest uppercase neon-text-glow">Paused</h1>
<div class="h-1 w-24 bg-primary mx-auto mt-4 rounded-full shadow-[0_0_10px_#8ed5ff]"></div>
</div>
<!-- Stats Reminder Panel -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col items-center justify-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest">Score</span>
<span class="font-stat-value text-stat-value text-on-background mt-1">042,500</span>
</div>
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col items-center justify-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest">Level</span>
<span class="font-stat-value text-stat-value text-primary mt-1">12</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full py-4 px-6 bg-surface-container-high border-2 border-on-background rounded-lg flex items-center justify-center gap-3 transition-all duration-200 group neon-box-glow">
<span class="material-symbols-outlined text-[28px] text-on-background group-hover:text-primary transition-colors">play_arrow</span>
<span class="font-headline-sm text-headline-sm text-on-background group-hover:text-primary uppercase tracking-wider transition-colors">Resume</span>
</button>
<!-- Secondary Actions -->
<button class="w-full py-3 px-6 bg-surface border border-outline-variant rounded-lg flex items-center justify-center gap-3 transition-all duration-200 group secondary-box-glow">
<span class="material-symbols-outlined text-[24px] text-on-surface-variant group-hover:text-secondary transition-colors">refresh</span>
<span class="font-headline-sm text-[18px] leading-[24px] font-semibold text-on-surface-variant group-hover:text-secondary uppercase tracking-wider transition-colors">Restart</span>
</button>
<button class="w-full py-3 px-6 bg-surface border border-outline-variant rounded-lg flex items-center justify-center gap-3 transition-all duration-200 group error-box-glow">
<span class="material-symbols-outlined text-[24px] text-on-surface-variant group-hover:text-error transition-colors">logout</span>
<span class="font-headline-sm text-[18px] leading-[24px] font-semibold text-on-surface-variant group-hover:text-error uppercase tracking-wider transition-colors">Exit to Menu</span>
</button>
</div>
</div>
</div>
</body></html>
